name: Feature A PR Check

on:
  pull_request:
    branches:
      - main  # Trigger when a PR is opened TO main
      - featurea # Trigger when a PR is opened TO featurea (optional)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Test
        run: |
          npm install
          npm run build
          echo "Build successful! Ready for review."